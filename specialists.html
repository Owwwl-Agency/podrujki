<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="description" content="Подружки — специалисты" />
    <title>Подружки — Специалисты</title>

    <link rel="stylesheet" href="css/base/reset.css" />
    <link rel="stylesheet" href="css/base/variables.css" />
    <link rel="stylesheet" href="css/base/fonts.css" />
    <link rel="stylesheet" href="css/layout/app.css" />
    <link rel="stylesheet" href="css/modules/header.css" />
    <link rel="stylesheet" href="css/modules/search.css" />
    <link rel="stylesheet" href="css/modules/filter-popup.css" />
    <link rel="stylesheet" href="css/modules/results-filters.css" />
    <link rel="stylesheet" href="css/modules/clinics.css" />
    <link rel="stylesheet" href="css/modules/specialists.css" />
    <link rel="stylesheet" href="css/modules/results.css" />
    <link rel="stylesheet" href="css/modules/results-map.css" />
    <link rel="stylesheet" href="css/modules/navbar.css" />
  </head>
  <body class="page-results page-results--specialists page-results--with-nav">
    <div class="app" id="app">
      <header class="header" data-block="header">
        <a class="header__back" href="index.html" aria-label="Назад">
          <img src="assets/icons/arrow-left.svg" alt="" />
        </a>
        <div class="header__center">
          <h1 class="header__title" data-text="header.title">Специалисты</h1>
          <div class="header__crumbs" data-bind="header.breadcrumbs"></div>
        </div>
        <button class="header__cart" type="button" aria-label="Корзина">
          <span class="header__cart-count" data-text="header.cartCount">37</span>
          <img src="assets/icons/bag.svg" alt="" />
        </button>
      </header>

      <main class="app__main results-main">
        <div class="results-sticky">
          <section class="results-search" data-block="search">
            <div class="results-search__row">
              <div class="results-search__field search__field">
                <img src="assets/icons/search.svg" alt="" />
                <input
                  class="search__input results-search__input"
                  type="search"
                  placeholder="Поиск услуг, клиник, специалистов"
                  readonly
                />
              </div>
              <button class="results-search__map" type="button" aria-label="На карте">
                <img class="results-search__map-icon" src="assets/icons/map-dark.svg" alt="" />
              </button>
            </div>
          </section>
        </div>

        <section class="results-tags" data-block="tags" aria-label="Фильтры"></section>

        <div class="results-stage">
          <section class="specialists__list results-specialists" data-block="results-list" aria-label="Специалисты"></section>
        </div>
      </main>

      <nav class="navbar" data-block="navbar" aria-label="Главное меню">
        <span class="navbar__indicator" aria-hidden="true"></span>
        <button class="navbar__item is-active" type="button" data-nav="search" aria-label="Поиск">
          <img src="assets/icons/nav-search.svg" alt="" />
        </button>
        <button class="navbar__item" type="button" data-nav="catalog" aria-label="Каталог">
          <img src="assets/icons/nav-catalog.svg" alt="" />
        </button>
        <button class="navbar__item" type="button" data-nav="calendar" aria-label="Записи">
          <img src="assets/icons/nav-calendar.svg" alt="" />
        </button>
        <button class="navbar__item" type="button" data-nav="sales" aria-label="Акции">
          <img src="assets/icons/nav-tag.svg" alt="" />
        </button>
        <button class="navbar__item" type="button" data-nav="profile" aria-label="Профиль">
          <img src="assets/icons/nav-profile.svg" alt="" />
        </button>
      </nav>
    </div>

    <script type="module" src="js/specialists-app.js"></script>
  </body>
</html>
